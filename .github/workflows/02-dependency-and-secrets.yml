name: 02 - Dependency & Secret Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  dependency-and-secret-audit:
    name: Dependency Audit & Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # STEP 1: Secret Detection in Git History & Code
      - name: Scan for Hardcoded Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # STEP 2: Setup Runtime
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      # STEP 3: Automated Dependency Vulnerability Check
      - name: Run Audit for High/Critical Vulnerabilities
        run: npm audit --audit-level=high