name: 05 - Scheduled OWASP ZAP Full Scan

on:
  schedule:
    # Every Friday at 22:30 UTC
    - cron : '30 22 * * 5'
  workflow_dispatch: # Allows manual execution from GitHub Actions UI
  # workflow_run:
  #  workflows: ["03 - Container Security & Vulnerability Scan"]
  #  types:
  #    - completed

jobs:
  dast-full-scan:
    name: OWASP ZAP Staging Environment Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Required for ZAP action to create/update issues for findings

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 1: Deep Dynamic Vulnerability Scan
      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          # change with your staging or any other environment domain
          # target: 'https://staging.your-company-domain.com'
          target: 'https://www.zaproxy.org/'
          # add if you need more specific rules table
          # rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false # Keeps workflow alive if vulnerabilities are detected
