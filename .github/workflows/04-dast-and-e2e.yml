name: 04 - DAST & Dynamic Security Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual execution from GitHub Actions UI
  # workflow_run:
  #  workflows: ["03 - Container Security & Vulnerability Scan"]
  #  types:
  #    - completed

jobs:
  dast-security-scan:
    name: OWASP ZAP Staging Environment Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Required for ZAP action to create/update issues for findings

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 1: Trigger OWASP ZAP Scan against Staging URL
      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          # change with your staging or any other environment domain
          # target: 'https://staging.your-company-domain.com'
          target: 'https://www.zaproxy.org/'
          # add if you need more specific rules table
          # rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -m 3' # -m 3 limits spidering to 3 minutes
          fail_action: false # Keeps workflow alive if vulnerabilities are detected

      # STEP 2: Setup Environment for Playwright E2E & A11y
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # STEP 3: Install Project Dependencies
      - name: Install Dependencies
        run: npm ci

      # STEP 4: Install Browsers for E2E Testing
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # STEP 5: Execute Playwright E2E & Accessibility (@axe-core) Tests
      - name: Execute E2E & A11y Tests
        run: npx playwright test